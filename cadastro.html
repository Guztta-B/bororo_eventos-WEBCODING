<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Organizadores | Bororó Eventos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topo">

        <a class="marca" href="index.html">
       
            Bororó <strong>Eventos</strong>
        </a>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a class="ativo" href="cadastro.html">Organizadores</a>
            <a class="nav-botao" href="cadastrar-evento.html">
                Divulgar evento
            </a>
        </nav>

    </header>

    <main>

        <section class="pagina-intro">

            <span class="etiqueta">
                JUNTE-SE À COMUNIDADE
            </span>

            <h1>Cadastro de organizador</h1>

            <p>
                Crie seu cadastro para divulgar eventos na cidade.
            </p>

        </section>

        <section class="form-area">

            <form id="form-organizador">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >

                <label for="telefone">
                    Telefone
                </label>

                <input
                    id="telefone"
                    name="telefone"
                    type="tel"
                    placeholder="(00) 00000-0000"
                    required
                >

                <label for="organizacao">
                    Organização (opcional)
                </label>

                <input
                    id="organizacao"
                    name="organizacao"
                >

                <label for="senha">
                    Senha (mínimo 6 caracteres)
                </label>

                <input
                    id="senha"
                    name="senha"
                    type="password"
                    minlength="6"
                    required
                >

                <label for="confirmar">
                    Confirmar senha
                </label>

                <input
                    id="confirmar"
                    name="confirmar"
                    type="password"
                    minlength="6"
                    required
                >

                <button class="botao" type="submit">
                    Criar cadastro
                </button>

                <p
                    id="mensagem-organizador"
                    class="mensagem"
                    role="status"
                ></p>

            </form>

        </section>

    </main>

    <footer>

        <a class="marcaFINAL    " href="index.html">
             Bororó Eventos
        </a>

        <p>
            <span>©Gusttavo Leme - 28329257</span>
        </p>

    </footer>

    <script src="js/script.js"></script>

</body>
</html>
